services:
  api:
    build:
      context: .
      target: ${TARGET:-dev}
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - mongo
    profiles:
      - full-stack

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    # Just start the engine in replica set mode.
    command: mongod --replSet rs0 --bind_ip_all

volumes:
  mongo_data:
