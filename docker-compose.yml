services:
  api:
    build:
      context: .
      target: ${TARGET:-dev}
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    # !!! IMPORTANT FOR PROD TESTING !!!
    # Comment out these volumes when testing production builds locally
    # to simulate actual production container behavior (no host mounts)
    # Keep these active only for development
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - mongo
    # Only start API if explicitly requested
    profiles:
      - full-stack

  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    depends_on:
      - mongo

volumes:
  mongo_data:
